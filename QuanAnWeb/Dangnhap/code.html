<p class="font-body-sm text-body-sm text-on-surface-variant">Nền tảng quản lý nhà hàng thông minh</p>

<!-- Tabs -->

<button class="flex-1 py-md font-label-lg text-label-lg text-primary font-bold border-b-2 border-primary transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2" id="tab-login">

</div>
<!-- Forms Container -->
<div class="relative w-full h-[500px] overflow-hidden">
<!-- Login Form -->

<div class="flex flex-col gap-xs">

</div>
<div class="flex flex-col gap-xs">

</div>
<div class="relative">
<input class="h-[48px] px-md pr-[40px] rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow w-full font-body-md text-on-surface" id="login-password" placeholder="Nhập mật khẩu..." type="password"/>

</button>
</div>
</div>
<div class="flex items-center gap-xs mt-xs">

</label>

                    Đăng ký tài khoản
                    <span class="material-symbols-outlined text-[18px]" data-icon="person_add">person_add</span>
</button>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            const activeTabClasses = ['text-primary', 'font-bold', 'border-primary'];
            const inactiveTabClasses = ['text-secondary', 'font-medium', 'border-transparent', 'hover:bg-surface-container-high'];

            function switchTab(isLogin) {
                if (isLogin) {
                    // Update Tabs
                    tabLogin.classList.remove(...inactiveTabClasses);
                    tabLogin.classList.add(...activeTabClasses);
                    tabRegister.classList.remove(...activeTabClasses);
                    tabRegister.classList.add(...inactiveTabClasses);

                    // Update Forms (Slide animation)
                    formLogin.style.transform = 'translateX(0)';
                    formRegister.style.transform = 'translateX(100%)';
                } else {
                    // Update Tabs
                    tabRegister.classList.remove(...inactiveTabClasses);
                    tabRegister.classList.add(...activeTabClasses);
                    tabLogin.classList.remove(...activeTabClasses);
                    tabLogin.classList.add(...inactiveTabClasses);

                    // Update Forms (Slide animation)
                    formLogin.style.transform = 'translateX(-100%)';
                    formRegister.style.transform = 'translateX(0)';
                }
            }

            tabLogin.addEventListener('click', () => switchTab(true));
            tabRegister.addEventListener('click', () => switchTab(false));
            
            // Password visibility toggle
            document.querySelectorAll('button[type="button"]').forEach(btn => {
                if(btn.querySelector('.material-symbols-outlined')?.textContent === 'visibility') {
                    btn.addEventListener('click', function() {
                        const input = this.previousElementSibling;
                        const icon = this.querySelector('.material-symbols-outlined');
                        if (input.type === 'password') {
                            input.type = 'text';
                            icon.textContent = 'visibility_off';
                            icon.setAttribute('data-icon', 'visibility_off');
                        } else {
                            input.type = 'password';
                            icon.textContent = 'visibility';
                            icon.setAttribute('data-icon', 'visibility');
                        }
                    });
                }
            });
        });
    </script>
