<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoàn tất Đăng ký - GustoPOS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#f9f9f9",
                        "primary": "#ac2d00",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1a1c1c",
                        "on-surface-variant": "#5b4139",
                        "outline-variant": "#e4beb4",
                        "error": "#ba1a1a",
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-4">

    <div class="bg-surface-container-lowest rounded-2xl shadow-lg border border-outline-variant/60 p-8 max-w-md w-full relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="material-symbols-outlined text-primary text-5xl mb-2" style="font-variation-settings: 'FILL' 1;">restaurant</span>
            <h1 class="text-2xl font-bold text-primary">Hoàn tất hồ sơ</h1>
            <p class="text-sm text-on-surface-variant mt-2">GustoPOS cần thêm số điện thoại của bạn để đảm bảo việc liên hệ khi đặt bàn và giao hàng.</p>
        </div>

        <!-- Form -->
        <form id="completeProfileForm" class="space-y-5">
            
            <!-- Email (Disabled) -->
            <div>
                <label for="email" class="block text-sm font-medium text-on-surface mb-1">Email (Tài khoản Google)</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">mail</span>
                    <input type="email" id="email" disabled class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border border-outline-variant/50 rounded-lg text-on-surface-variant/80 cursor-not-allowed">
                </div>
            </div>

            <!-- Full Name (Disabled) -->
            <div>
                <label for="fullName" class="block text-sm font-medium text-on-surface mb-1">Họ và tên</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">person</span>
                    <input type="text" id="fullName" disabled class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border border-outline-variant/50 rounded-lg text-on-surface-variant/80 cursor-not-allowed">
                </div>
            </div>

            <!-- Phone (Nhập liệu) -->
            <div>
                <label for="phone" class="block text-sm font-medium text-on-surface mb-1">Số điện thoại liên hệ <span class="text-error">*</span></label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">phone</span>
                    <input type="tel" id="phone" required placeholder="Nhập số điện thoại (ví dụ: 0901234567)" 
                           pattern="[0-9]{9,11}"
                           maxlength="11"
                           title="Vui lòng nhập 9-11 chữ số"
                           aria-describedby="phone-error"
                           class="w-full pl-10 pr-4 py-2.5 bg-white border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg text-base text-on-surface transition-all">
                </div>
                <p id="phone-error" class="hidden text-xs text-error mt-1"></p>
            </div>

            <!-- Lỗi hiển thị chung -->
            <div id="errorMessage" class="hidden text-error text-sm font-medium bg-red-50 p-3 rounded-lg border border-red-100"></div>

            <!-- Nút submit -->
            <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-[#8c2400] text-on-primary font-semibold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                Hoàn tất đăng ký
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>
    </div>

    <script type="module">
        import { authApi } from '../../js/api/authApi.js?auth-session-2';
        import { saveCustomerSession } from '../../js/api/session.js?auth-session-2';

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const name = urlParams.get('name');
            const returnUrl = urlParams.get('returnUrl');

            if (!email) {
                window.location.replace('./login_register.html');
                return;
            }

            document.getElementById('email').value = email;
            document.getElementById('fullName').value = decodeURIComponent(name || 'Khách hàng');

            const form = document.getElementById('completeProfileForm');
            const phoneInput = document.getElementById('phone');
            const phoneError = document.getElementById('phone-error');
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            function setPhoneError(msg) {
                if (msg) {
                    phoneError.textContent = msg;
                    phoneError.classList.remove('hidden');
                    phoneInput.classList.add('border-error');
                    phoneInput.setAttribute('aria-invalid', 'true');
                } else {
                    phoneError.textContent = '';
                    phoneError.classList.add('hidden');
                    phoneInput.classList.remove('border-error');
                    phoneInput.removeAttribute('aria-invalid');
                }
            }

            phoneInput.addEventListener('input', () => {
                setPhoneError('');
                errorDiv.classList.add('hidden');
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                setPhoneError('');
                errorDiv.classList.add('hidden');

                const phone = phoneInput.value.trim();
                if (!phone) {
                    setPhoneError('Vui lòng nhập số điện thoại liên hệ.');
                    phoneInput.focus();
                    return;
                }
                if (!/^\d{9,11}$/.test(phone)) {
                    setPhoneError('Số điện thoại phải có từ 9 đến 11 chữ số.');
                    phoneInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">autorenew</span> Đang xử lý...';

                try {
                    const response = await authApi.completeGoogleProfile({
                        email: email,
                        fullName: decodeURIComponent(name || 'Khách hàng'),
                        phone: phone
                    });

                    saveCustomerSession(response, true);
                    globalThis.dispatchEvent(new CustomEvent('gusto:session-updated'));
                    let targetUrl = returnUrl && !returnUrl.includes('login_register') ? returnUrl : '/pages/profile/index.html';
                    if (targetUrl === '/profile/index.html' || targetUrl.startsWith('/profile/')) {
                        targetUrl = `/pages${targetUrl}`;
                    }
                    window.location.replace(targetUrl);
                } catch (error) {
                    const msg = error?.message || 'Có lỗi xảy ra khi hoàn tất hồ sơ.';
                    if (msg.toLowerCase().includes('số điện thoại')) {
                        setPhoneError(msg);
                        phoneInput.focus();
                    } else {
                        errorDiv.textContent = msg;
                        errorDiv.classList.remove('hidden');
                    }
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Hoàn tất đăng ký <span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
                }
            });
        });
    </script>
</body>
</html>
