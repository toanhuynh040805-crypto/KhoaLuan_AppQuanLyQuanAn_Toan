# Low-memory Gradle profile for Flutter Android development.
# Optimized for machines running Flutter emulator + Backend + VS Code together.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false

android.useAndroidX=true

# Disable Kotlin incremental cache because the project is on E: while Pub cache is on C:.
# This avoids cross-drive cache errors such as "different roots" during Flutter builds.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
