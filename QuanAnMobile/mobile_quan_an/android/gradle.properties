# Balanced Gradle profile for Flutter Android development.
# Keep a single worker/serial build, but give AGP + Kotlin enough JVM space
# to avoid the single-use Gradle daemon crashing during assembleDebug.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false

android.useAndroidX=true

# Disable Kotlin incremental cache because the project is on E: while Pub cache is on C:.
# This avoids cross-drive cache errors such as "different roots" during Flutter builds.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
