# Low-native-memory Gradle profile for Flutter Android development.
# This machine runs the Android emulator together with Flutter/VS Code, so
# keep the Java heap conservative and leave enough Windows commit/native RAM.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false

android.useAndroidX=true

# Disable Kotlin incremental cache because the project is on E: while Pub cache is on C:.
# This avoids cross-drive cache errors such as "different roots" during Flutter builds.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
